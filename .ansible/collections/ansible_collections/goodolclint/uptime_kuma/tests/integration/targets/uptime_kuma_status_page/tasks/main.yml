---
- name: Test uptime_kuma_status_page module
  block:
    - name: Create a status page
      goodolclint.uptime_kuma.uptime_kuma_status_page:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        slug: integration-test-page
        title: Integration Test Status
        description: Test status page
        published: true
        state: present
      register: create_result

    - name: Verify status page was created
      ansible.builtin.assert:
        that:
          - create_result is changed

    - name: Create same status page again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_status_page:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        slug: integration-test-page
        title: Integration Test Status
        published: true
        state: present
      register: idem_result

    - name: Verify no change on second run
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Delete status page
      goodolclint.uptime_kuma.uptime_kuma_status_page:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        slug: integration-test-page
        state: absent
      register: delete_result

    - name: Verify status page was deleted
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete status page again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_status_page:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        slug: integration-test-page
        state: absent
      register: delete_idem

    - name: Verify no change on second delete
      ansible.builtin.assert:
        that:
          - delete_idem is not changed
