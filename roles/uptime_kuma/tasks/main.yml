---
# goodolclint.uptime_kuma.uptime_kuma role
# Manages Uptime Kuma resources declaratively via variable lists.

- name: Create the admin account on a fresh instance
  goodolclint.uptime_kuma.uptime_kuma_setup:
    api_url: "{{ uptime_kuma_api_url }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    username: "{{ uptime_kuma_api_username }}"
    password: "{{ uptime_kuma_api_password }}"
  when: uptime_kuma_bootstrap_admin | bool

- name: Log in once (password logins are rate-limited to 20/min)
  goodolclint.uptime_kuma.uptime_kuma_login:
    api_url: "{{ uptime_kuma_api_url }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    api_username: "{{ uptime_kuma_api_username }}"
    api_password: "{{ uptime_kuma_api_password }}"
  register: _uptime_kuma_login
  no_log: true
  when: uptime_kuma_api_token | length == 0

- name: Use the session token for every task
  ansible.builtin.set_fact:
    _uptime_kuma_token: "{{ uptime_kuma_api_token if uptime_kuma_api_token | length > 0 else _uptime_kuma_login.token }}"
  no_log: true

- name: Manage notifications
  goodolclint.uptime_kuma.uptime_kuma_notification:
    api_url: "{{ uptime_kuma_api_url }}"
    api_token: "{{ _uptime_kuma_token }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    name: "{{ item.name }}"
    notification_type: "{{ item.notification_type | default(omit) }}"
    is_default: "{{ item.is_default | default(false) }}"
    apply_existing: "{{ item.apply_existing | default(false) }}"
    notification_config: "{{ item.notification_config | default({}) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ uptime_kuma_notifications }}"
  loop_control:
    label: "{{ item.name }}"

- name: Manage tags
  goodolclint.uptime_kuma.uptime_kuma_tag:
    api_url: "{{ uptime_kuma_api_url }}"
    api_token: "{{ _uptime_kuma_token }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    name: "{{ item.name }}"
    color: "{{ item.color | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ uptime_kuma_tags }}"
  loop_control:
    label: "{{ item.name }}"

- name: Manage monitors
  goodolclint.uptime_kuma.uptime_kuma_monitor:
    api_url: "{{ uptime_kuma_api_url }}"
    api_token: "{{ _uptime_kuma_token }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    name: "{{ mon.name }}"
    monitor_type: "{{ mon.monitor_type | default(omit) }}"
    url: "{{ mon.url | default(omit) }}"
    hostname: "{{ mon.hostname | default(omit) }}"
    port: "{{ mon.port | default(omit) }}"
    interval: "{{ mon.interval | default(omit) }}"
    retry_interval: "{{ mon.retry_interval | default(omit) }}"
    max_retries: "{{ mon.max_retries | default(omit) }}"
    resend_interval: "{{ mon.resend_interval | default(omit) }}"
    timeout: "{{ mon.timeout | default(omit) }}"
    upside_down: "{{ mon.upside_down | default(omit) }}"
    description: "{{ mon.description | default(omit) }}"
    keyword: "{{ mon.keyword | default(omit) }}"
    invert_keyword: "{{ mon.invert_keyword | default(omit) }}"
    json_path: "{{ mon.json_path | default(omit) }}"
    json_path_operator: "{{ mon.json_path_operator | default(omit) }}"
    expected_value: "{{ mon.expected_value | default(omit) }}"
    ignore_tls: "{{ mon.ignore_tls | default(omit) }}"
    max_redirects: "{{ mon.max_redirects | default(omit) }}"
    accepted_statuscodes: "{{ mon.accepted_statuscodes | default(omit) }}"
    method: "{{ mon.method | default(omit) }}"
    body: "{{ mon.body | default(omit) }}"
    headers: "{{ mon.headers | default(omit) }}"
    dns_resolve_server: "{{ mon.dns_resolve_server | default(omit) }}"
    dns_resolve_type: "{{ mon.dns_resolve_type | default(omit) }}"
    docker_container: "{{ mon.docker_container | default(omit) }}"
    docker_host: "{{ mon.docker_host | default(omit) }}"
    database_connection_string: "{{ mon.database_connection_string | default(omit) }}"
    database_query: "{{ mon.database_query | default(omit) }}"
    mqtt_username: "{{ mon.mqtt_username | default(omit) }}"
    mqtt_password: "{{ mon.mqtt_password | default(omit) }}"
    mqtt_topic: "{{ mon.mqtt_topic | default(omit) }}"
    mqtt_success_message: "{{ mon.mqtt_success_message | default(omit) }}"
    proxy_id: "{{ mon.proxy_id | default(omit) }}"
    parent: "{{ mon.parent | default(omit) }}"
    notification_ids: "{{ mon.notification_ids | default(omit) }}"
    notification_names: "{{ mon.notification_names | default(omit) }}"
    active: "{{ mon.active | default(true) }}"
    state: "{{ mon.state | default('present') }}"
  loop: "{{ uptime_kuma_monitors }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    mon: "{{ uptime_kuma_monitor_defaults | combine(item) }}"

- name: Manage monitor tags
  goodolclint.uptime_kuma.uptime_kuma_monitor_tag:
    api_url: "{{ uptime_kuma_api_url }}"
    api_token: "{{ _uptime_kuma_token }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    monitor_name: "{{ item.monitor_name }}"
    tag_name: "{{ item.tag_name }}"
    value: "{{ item.value | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ uptime_kuma_monitor_tags }}"
  loop_control:
    label: "{{ item.monitor_name }}:{{ item.tag_name }}"

- name: Manage status pages
  goodolclint.uptime_kuma.uptime_kuma_status_page:
    api_url: "{{ uptime_kuma_api_url }}"
    api_token: "{{ _uptime_kuma_token }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    slug: "{{ item.slug }}"
    title: "{{ item.title | default(omit) }}"
    description: "{{ item.description | default(omit) }}"
    theme: "{{ item.theme | default(omit) }}"
    published: "{{ item.published | default(omit) }}"
    show_tags: "{{ item.show_tags | default(omit) }}"
    show_powered_by: "{{ item.show_powered_by | default(omit) }}"
    show_certificate_expiry: "{{ item.show_certificate_expiry | default(omit) }}"
    custom_css: "{{ item.custom_css | default(omit) }}"
    footer_text: "{{ item.footer_text | default(omit) }}"
    google_analytics_id: "{{ item.google_analytics_id | default(omit) }}"
    domain_name_list: "{{ item.domain_name_list | default(omit) }}"
    public_group_list: "{{ item.public_group_list | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ uptime_kuma_status_pages }}"
  loop_control:
    label: "{{ item.slug }}"

- name: Manage maintenance windows
  goodolclint.uptime_kuma.uptime_kuma_maintenance:
    api_url: "{{ uptime_kuma_api_url }}"
    api_token: "{{ _uptime_kuma_token }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    title: "{{ item.title }}"
    strategy: "{{ item.strategy | default(omit) }}"
    active: "{{ item.active | default(omit) }}"
    description: "{{ item.description | default(omit) }}"
    date_range: "{{ item.date_range | default(omit) }}"
    interval_day: "{{ item.interval_day | default(omit) }}"
    weekdays: "{{ item.weekdays | default(omit) }}"
    days_of_month: "{{ item.days_of_month | default(omit) }}"
    time_range: "{{ item.time_range | default(omit) }}"
    cron: "{{ item.cron | default(omit) }}"
    duration_minutes: "{{ item.duration_minutes | default(omit) }}"
    timezone: "{{ item.timezone | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ uptime_kuma_maintenances }}"
  loop_control:
    label: "{{ item.title }}"

- name: Manage API keys
  goodolclint.uptime_kuma.uptime_kuma_api_key:
    api_url: "{{ uptime_kuma_api_url }}"
    api_token: "{{ _uptime_kuma_token }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    name: "{{ item.name }}"
    expires: "{{ item.expires | default(omit) }}"
    active: "{{ item.active | default(true) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ uptime_kuma_api_keys }}"
  loop_control:
    label: "{{ item.name }}"
  register: uptime_kuma_api_keys_result
  no_log: true

- name: Update settings
  goodolclint.uptime_kuma.uptime_kuma_settings:
    api_url: "{{ uptime_kuma_api_url }}"
    api_token: "{{ _uptime_kuma_token }}"
    validate_certs: "{{ uptime_kuma_validate_certs }}"
    api_timeout: "{{ uptime_kuma_api_timeout }}"
    check_update: "{{ uptime_kuma_settings.check_update | default(omit) }}"
    check_beta: "{{ uptime_kuma_settings.check_beta | default(omit) }}"
    keep_data_period_days: "{{ uptime_kuma_settings.keep_data_period_days | default(omit) }}"
    server_timezone: "{{ uptime_kuma_settings.server_timezone | default(omit) }}"
    entry_page: "{{ uptime_kuma_settings.entry_page | default(omit) }}"
    search_engine_index: "{{ uptime_kuma_settings.search_engine_index | default(omit) }}"
    primary_base_url: "{{ uptime_kuma_settings.primary_base_url | default(omit) }}"
    steam_api_key: "{{ uptime_kuma_settings.steam_api_key | default(omit) }}"
    dns_cache: "{{ uptime_kuma_settings.dns_cache | default(omit) }}"
    tls_expiry_notify_days: "{{ uptime_kuma_settings.tls_expiry_notify_days | default(omit) }}"
    disable_auth: "{{ uptime_kuma_settings.disable_auth | default(omit) }}"
    trust_proxy: "{{ uptime_kuma_settings.trust_proxy | default(omit) }}"
    password: "{{ uptime_kuma_settings.password | default(omit) }}"
    state: present
  when: uptime_kuma_settings | length > 0
