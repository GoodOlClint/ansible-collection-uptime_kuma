security_fixes:
  - >-
    uptime_kuma_notification - ``notification_config`` is now ``no_log`` (values under credential-looking
    keys stay masked; other values are unmasked so results remain readable), and provider configuration is
    no longer part of the returned ``notification`` or the diff at all. Previously provider secrets appeared
    in task output, ``--diff``, ``invocation.module_args`` and the target's syslog, while the documentation
    claimed they were treated as no_log.
  - >-
    uptime_kuma_monitor - every field Uptime Kuma classifies as sensitive (``headers``, ``body``,
    ``basic_auth_pass``, ``oauth_client_secret``, ``tlsKey``, ``pushToken``, ``radiusPassword``,
    ``mqttPassword``, ``databaseConnectionString``, ...) is omitted from the returned ``monitor`` and the
    diff, and ``headers``/``body`` are now ``no_log``. They were returned in clear for monitors whose
    secrets were set in the UI or by another task.
  - uptime_kuma_settings - ``steamAPIKey`` is omitted from the returned ``settings`` and the diff (``state=query`` returned it in clear).
  - >-
    uptime_kuma role - the login, session-token and API-key tasks run with ``no_log`` so the admin
    session token and newly created API keys no longer reach ``-v`` output. Created keys are available
    to the caller as ``uptime_kuma_api_keys_result.results[*].key`` on the run that created them.
minor_changes:
  - uptime_kuma_login and uptime_kuma_api_key - document that the returned token / key is in clear and the registering task should set ``no_log``.
