bugfixes:
  - >-
    uptime_kuma_notification - changes to ``notification_config`` on an existing notification are
    now detected and applied; previously only ``name``, ``notification_type`` and ``is_default``
    were compared, so a changed webhook URL or topic reported ``changed=false`` and was never
    written.
  - >-
    uptime_kuma_status_page - ``description``, ``footer_text``, ``google_analytics_id``,
    ``show_certificate_expiry``, ``domain_name_list`` and ``public_group_list`` are now compared on
    an existing page instead of being silently ignored after creation.
  - >-
    uptime_kuma_settings - a ``steam_api_key``-only change is now written; the key was wrongly treated as unreadable.
  - >-
    uptime_kuma_settings - disabling authentication without ``password`` now fails up front instead
    of at the server.
  - >-
    uptime_kuma_maintenance - a changed ``timezone`` on an existing window is now applied.

  - >-
    uptime_kuma_monitor_tag - a tag assignment stored with an empty (NULL) value no longer gets a
    duplicate row on the first run.
  - >-
    uptime_kuma_monitor - creating with ``active=false`` now pauses the monitor before reading it
    back, so the result and diff show the paused state.
  - >-
    uptime_kuma_status_page - the check-mode create result now includes ``slug`` and ``title``.
minor_changes:
  - >-
    uptime_kuma_monitor and uptime_kuma_notification - credentials are compared like every other
    field, so a rotated password or token is applied and the next run reports no change; they are
    still never part of the result or diff (ADR 0003). The previous "write-only" exclusion made
    credential rotation a silent no-op.
  - >-
    uptime_kuma_maintenance - ``duration_minutes`` documentation now states it only applies to
    ``strategy=cron``.
  - >-
    uptime_kuma_status_page - ``google_analytics_id`` is stored as Uptime Kuma 2.x ``analyticsId``
    with ``analyticsType=google`` (the 1.x key it used before was ignored by the server);
    ``published`` is no longer sent or compared because 2.x does not change it after creation; the
    public group list is fetched only when ``public_group_list`` is managed.
breaking_changes:
  - >-
    uptime_kuma_api_key - a different ``expires`` on an existing key now fails with a
    remove-and-recreate message instead of being silently ignored (Uptime Kuma cannot edit a key's
    expiry).
  - >-
    uptime_kuma_monitor_tag - ``state=absent`` on an assignment stored with a NULL value now fails
    with an explanation (the server cannot match it) instead of silently doing nothing (the empty value the
    module sent never matched the NULL row, so no delete was ever issued).
  - >-
    uptime_kuma_status_page - ``published`` no longer has any effect: Uptime Kuma 2.x does not change it
    after creation, so it is neither sent nor compared (it previously reported ``changed=true`` on every
    run when set to ``false``).
