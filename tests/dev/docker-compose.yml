services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma-dev
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3001/"]
      interval: 5s
      timeout: 5s
      retries: 20
