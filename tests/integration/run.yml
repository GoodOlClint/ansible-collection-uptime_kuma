---
# Runs every integration target against the instance in integration_config.yml.
# Usage: ansible-playbook tests/integration/run.yml   (collection must be on ANSIBLE_COLLECTIONS_PATH)
- hosts: localhost
  gather_facts: false
  vars_files:
    - integration_config.yml
  tasks:
    - name: Run target uptime_kuma_setup
      ansible.builtin.include_tasks: targets/uptime_kuma_setup/tasks/main.yml

    - name: Log in once (password logins are rate-limited to 20/min)
      goodolclint.uptime_kuma.uptime_kuma_login:
        api_url: "{{ uptime_kuma_api_url }}"
        api_username: "{{ uptime_kuma_api_username }}"
        api_password: "{{ uptime_kuma_api_password }}"
      register: kuma_login

    - name: Expose the token to the targets
      ansible.builtin.set_fact:
        uptime_kuma_api_token: "{{ kuma_login.token }}"

    - name: Run target {{ item }}
      ansible.builtin.include_tasks: "targets/{{ item }}/tasks/main.yml"
      loop:
        - uptime_kuma_tag
        - uptime_kuma_notification
        - uptime_kuma_monitor
        - uptime_kuma_monitor_tag
        - uptime_kuma_maintenance
        - uptime_kuma_status_page
        - uptime_kuma_api_key
        - uptime_kuma_settings
