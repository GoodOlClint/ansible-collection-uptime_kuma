---
- name: Test uptime_kuma_monitor module
  block:
    - name: Create a monitor in check mode
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        state: present
      check_mode: true
      register: check_create

    - name: Verify check mode predicted a creation without creating
      ansible.builtin.assert:
        that:
          - check_create is changed
          - check_create.monitor.name == "integration-test-monitor"
          - check_create.diff.before == {}

    # ── CREATE ────────────────────────────────────────────────────────
    - name: Create an HTTP monitor
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        interval: 120
        state: present
      register: create_result

    - name: Verify monitor was created
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.monitor.name == "integration-test-monitor"
          - "'basic_auth_pass' not in create_result.monitor"
          - "'tlsKey' not in create_result.monitor"

    # ── IDEMPOTENCY ───────────────────────────────────────────────────
    - name: Create same monitor again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        interval: 120
        state: present
      register: idem_result

    - name: Verify no change on second run
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    # ── UPDATE ────────────────────────────────────────────────────────
    - name: Update monitor interval
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        interval: 300
        state: present
      register: update_result

    - name: Update monitor interval again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        interval: 300
        state: present
      register: update_idem

    - name: Verify the update persisted
      ansible.builtin.assert:
        that:
          - update_result is changed
          - update_result.monitor.interval == 300
          - update_idem is not changed

    - name: Pause the monitor
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        interval: 300
        active: false
        state: present
      register: pause_result

    - name: Pause again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        interval: 300
        active: false
        state: present
      register: pause_idem

    - name: Verify pause
      ansible.builtin.assert:
        that:
          - pause_result is changed
          - pause_result.monitor.active is false
          - pause_idem is not changed

    # ── CREDENTIALS ───────────────────────────────────────────────────
    - name: Create a database monitor with a connection string
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-db-monitor
        monitor_type: postgres
        database_connection_string: postgres://bot:first@db.example.com:5432/app
        database_query: SELECT 1
        state: present
      register: db_create

    - name: Rotate the connection string
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-db-monitor
        monitor_type: postgres
        database_connection_string: postgres://bot:second@db.example.com:5432/app
        database_query: SELECT 1
        state: present
      register: db_rotate

    - name: Rotate again (no-op)
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-db-monitor
        monitor_type: postgres
        database_connection_string: postgres://bot:second@db.example.com:5432/app
        database_query: SELECT 1
        state: present
      register: db_idem

    - name: Verify a credential rotation is applied exactly once and never echoed
      ansible.builtin.assert:
        that:
          - db_create is changed
          - db_rotate is changed
          - db_idem is not changed
          - "'databaseConnectionString' not in db_rotate.monitor"
          - "'databaseConnectionString' not in db_rotate.diff.after"

    # ── CHECK MODE ────────────────────────────────────────────────────
    - name: Delete monitor in check mode
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        state: absent
      check_mode: true
      register: check_delete

    - name: Verify check mode reports change
      ansible.builtin.assert:
        that:
          - check_delete is changed

    # ── DELETE ─────────────────────────────────────────────────────────
    - name: Delete monitor
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        state: absent
      register: delete_result

    - name: Verify monitor was deleted
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete monitor again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        state: absent
      register: delete_idem

    - name: Verify no change on second delete
      ansible.builtin.assert:
        that:
          - delete_idem is not changed

  always:
    - name: Clean up
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: "{{ monitor_name }}"
        state: absent
      loop: [integration-test-monitor, integration-test-db-monitor]
      loop_control:
        loop_var: monitor_name
      failed_when: false
