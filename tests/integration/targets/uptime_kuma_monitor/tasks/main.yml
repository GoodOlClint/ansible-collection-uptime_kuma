---
- name: Test uptime_kuma_monitor module
  block:
    # ── CREATE ────────────────────────────────────────────────────────
    - name: Create an HTTP monitor
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        interval: 120
        state: present
      register: create_result

    - name: Verify monitor was created
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.monitor.name == "integration-test-monitor"
          - "'basic_auth_pass' not in create_result.monitor"
          - "'tlsKey' not in create_result.monitor"

    # ── IDEMPOTENCY ───────────────────────────────────────────────────
    - name: Create same monitor again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        interval: 120
        state: present
      register: idem_result

    - name: Verify no change on second run
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    # ── UPDATE ────────────────────────────────────────────────────────
    - name: Update monitor interval
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        monitor_type: http
        url: https://example.com
        interval: 300
        state: present
      register: update_result

    - name: Verify monitor was updated
      ansible.builtin.assert:
        that:
          - update_result is changed

    # ── CHECK MODE ────────────────────────────────────────────────────
    - name: Delete monitor in check mode
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        state: absent
      check_mode: true
      register: check_delete

    - name: Verify check mode reports change
      ansible.builtin.assert:
        that:
          - check_delete is changed

    # ── DELETE ─────────────────────────────────────────────────────────
    - name: Delete monitor
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        state: absent
      register: delete_result

    - name: Verify monitor was deleted
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete monitor again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-test-monitor
        state: absent
      register: delete_idem

    - name: Verify no change on second delete
      ansible.builtin.assert:
        that:
          - delete_idem is not changed
