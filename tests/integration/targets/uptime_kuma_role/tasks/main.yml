---
- name: Test the uptime_kuma role
  block:
    - name: Apply the role
      ansible.builtin.include_role:
        name: goodolclint.uptime_kuma.uptime_kuma
      vars:
        uptime_kuma_notifications:
          - name: integration-role-webhook
            notification_type: webhook
            notification_config:
              webhookURL: https://example.com/role-hook
              webhookContentType: "application/json"
        uptime_kuma_tags:
          - name: integration-role-tag
            color: "#123456"
        uptime_kuma_monitor_defaults:
          interval: 120
          notification_names: [integration-role-webhook]
        uptime_kuma_monitors:
          - name: integration-role-monitor
            monitor_type: http
            url: https://example.com
          - name: integration-role-monitor-2
            monitor_type: http
            url: https://example.org
            interval: 300
        uptime_kuma_monitor_tags:
          - monitor_name: integration-role-monitor
            tag_name: integration-role-tag
        uptime_kuma_status_pages:
          - slug: integration-role-page
            title: Integration Role Page
            show_tags: true
            custom_css: "body { color: red; }"
        uptime_kuma_maintenances:
          - title: integration-role-maintenance
            strategy: cron
            cron: "0 5 * * *"
            duration_minutes: 45
        uptime_kuma_settings:
          keep_data_period_days: 120

    - name: Re-apply each managed resource directly to prove the role converged
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: "{{ item.name }}"
        monitor_type: http
        url: "{{ item.url }}"
        interval: "{{ item.interval }}"
        notification_names: [integration-role-webhook]
        state: present
      loop:
        - {name: integration-role-monitor, url: "https://example.com", interval: 120}
        - {name: integration-role-monitor-2, url: "https://example.org", interval: 300}
      loop_control:
        loop_var: item
      register: monitors

    - name: Verify defaults merged under each monitor and nothing drifted
      ansible.builtin.assert:
        that:
          - monitors.results | map(attribute='changed') | select | list | length == 0
          - monitors.results[0].monitor.interval == 120
          - monitors.results[1].monitor.interval == 300

    - name: Verify the tag assignment converged
      goodolclint.uptime_kuma.uptime_kuma_monitor_tag:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        monitor_name: integration-role-monitor
        tag_name: integration-role-tag
        state: present
      register: role_tag

    - name: Verify the notification and tag converged
      goodolclint.uptime_kuma.uptime_kuma_notification:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-role-webhook
        notification_type: webhook
        notification_config:
          webhookURL: https://example.com/role-hook
          webhookContentType: "application/json"
        state: present
      register: role_notification

    - name: Verify the tag converged
      goodolclint.uptime_kuma.uptime_kuma_tag:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-role-tag
        color: "#123456"
        state: present
      register: role_tag_obj

    - name: Verify the status page converged
      goodolclint.uptime_kuma.uptime_kuma_status_page:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        slug: integration-role-page
        title: Integration Role Page
        show_tags: true
        custom_css: "body { color: red; }"
        state: present
      register: role_page

    - name: Verify the maintenance window converged
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-role-maintenance
        strategy: cron
        cron: "0 5 * * *"
        duration_minutes: 45
        state: present
      register: role_maintenance

    - name: Verify the settings converged
      goodolclint.uptime_kuma.uptime_kuma_settings:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        keep_data_period_days: 120
        state: present
      register: role_settings

    - name: Verify no drift on anything the role created
      ansible.builtin.assert:
        that:
          - role_tag is not changed
          - role_notification is not changed
          - role_tag_obj is not changed
          - role_page is not changed
          - role_page.status_page.showTags is true
          - 'role_page.status_page.customCSS == "body { color: red; }"'
          - role_maintenance is not changed
          - role_maintenance.maintenance.cron == "0 5 * * *"
          - role_maintenance.maintenance.durationMinutes == 45
          - role_settings is not changed
          - role_settings.settings.keepDataPeriodDays == 120

  always:
    - name: Clean up monitors
      goodolclint.uptime_kuma.uptime_kuma_monitor:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: "{{ monitor_name }}"
        state: absent
      loop: [integration-role-monitor, integration-role-monitor-2]
      loop_control:
        loop_var: monitor_name
      failed_when: false

    - name: Clean up tag and notification
      goodolclint.uptime_kuma.uptime_kuma_tag:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-role-tag
        state: absent
      failed_when: false

    - name: Clean up notification
      goodolclint.uptime_kuma.uptime_kuma_notification:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        name: integration-role-webhook
        state: absent
      failed_when: false

    - name: Clean up status page
      goodolclint.uptime_kuma.uptime_kuma_status_page:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        slug: integration-role-page
        state: absent
      failed_when: false

    - name: Clean up maintenance window
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-role-maintenance
        state: absent
      failed_when: false
