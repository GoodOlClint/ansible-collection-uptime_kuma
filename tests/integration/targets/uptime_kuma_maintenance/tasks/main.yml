---
- name: Test uptime_kuma_maintenance module
  block:
    - name: Create a manual maintenance window
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        strategy: manual
        description: Test maintenance window
        state: present
      register: create_result

    - name: Verify maintenance was created
      ansible.builtin.assert:
        that:
          - create_result is changed

    - name: Create same maintenance again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        strategy: manual
        description: Test maintenance window
        state: present
      register: idem_result

    - name: Verify no change on second run
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Set the timezone
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        strategy: manual
        description: Test maintenance window
        timezone: UTC
        state: present
      register: tz_result

    - name: Re-run with the timezone
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        strategy: manual
        description: Test maintenance window
        timezone: UTC
        state: present
      register: tz_idem

    - name: Verify timezone drift was applied once
      ansible.builtin.assert:
        that:
          - tz_result is changed
          - tz_idem is not changed
          - tz_idem.maintenance.timezoneOption == "UTC"

    - name: Delete maintenance
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        state: absent
      register: delete_result

    - name: Verify maintenance was deleted
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete maintenance again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        state: absent
      register: delete_idem

    - name: Verify no change on second delete
      ansible.builtin.assert:
        that:
          - delete_idem is not changed

  always:
    - name: Clean up
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        state: absent
      failed_when: false
