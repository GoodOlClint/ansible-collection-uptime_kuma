---
- name: Test uptime_kuma_maintenance module
  block:
    - name: Create a manual maintenance window
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        strategy: manual
        description: Test maintenance window
        state: present
      register: create_result

    - name: Verify maintenance was created
      ansible.builtin.assert:
        that:
          - create_result is changed

    - name: Create same maintenance again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        strategy: manual
        description: Test maintenance window
        state: present
      register: idem_result

    - name: Verify no change on second run
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Set the timezone
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        strategy: manual
        description: Test maintenance window
        timezone: UTC
        state: present
      register: tz_result

    - name: Re-run with the timezone
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        strategy: manual
        description: Test maintenance window
        timezone: UTC
        state: present
      register: tz_idem

    - name: Verify timezone drift was applied once
      ansible.builtin.assert:
        that:
          - tz_result is changed
          - tz_idem is not changed
          - tz_idem.maintenance.timezoneOption == "UTC"

    - name: Create a recurring-weekday window
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-weekly
        strategy: recurring-weekday
        weekdays: [1, 3]
        time_range:
          - {hours: 2, minutes: 0}
          - {hours: 4, minutes: 30}
        timezone: UTC
        state: present
      register: weekly

    - name: Create the same recurring-weekday window again
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-weekly
        strategy: recurring-weekday
        weekdays: [1, 3]
        time_range:
          - {hours: 2, minutes: 0}
          - {hours: 4, minutes: 30}
        timezone: UTC
        state: present
      register: weekly_idem

    - name: Create a cron window
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-cron
        strategy: cron
        cron: "0 4 * * *"
        duration_minutes: 30
        state: present
      register: cron_result

    - name: Create the same cron window again
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-cron
        strategy: cron
        cron: "0 4 * * *"
        duration_minutes: 30
        state: present
      register: cron_idem

    - name: Verify the scheduled strategies persist and are idempotent
      ansible.builtin.assert:
        that:
          - weekly is changed
          - weekly.maintenance.weekdays == [1, 3]
          - weekly.maintenance.timeRange | length == 2
          - weekly_idem is not changed
          - cron_result is changed
          - cron_result.maintenance.cron == "0 4 * * *"
          - cron_result.maintenance.durationMinutes == 30
          - cron_idem is not changed

    - name: Delete maintenance
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        state: absent
      register: delete_result

    - name: Verify maintenance was deleted
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete maintenance again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: integration-test-maintenance
        state: absent
      register: delete_idem

    - name: Verify no change on second delete
      ansible.builtin.assert:
        that:
          - delete_idem is not changed

  always:
    - name: Clean up
      goodolclint.uptime_kuma.uptime_kuma_maintenance:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        title: "{{ maintenance_title }}"
        state: absent
      loop: [integration-test-maintenance, integration-test-weekly, integration-test-cron]
      loop_control:
        loop_var: maintenance_title
      failed_when: false
