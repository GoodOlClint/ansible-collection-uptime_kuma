---
- name: Test uptime_kuma_settings module
  block:
    - name: Query current settings
      goodolclint.uptime_kuma.uptime_kuma_settings:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        state: query
      register: query_result

    - name: Verify settings were returned
      ansible.builtin.assert:
        that:
          - query_result is not changed
          - query_result.settings is defined
          - query_result.settings is mapping

    - name: Update keep data period
      goodolclint.uptime_kuma.uptime_kuma_settings:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        keep_data_period_days: 90
        state: present
      register: update_result

    - name: Verify settings were updated
      ansible.builtin.assert:
        that:
          - update_result is changed

    - name: Update same settings again (idempotency)
      goodolclint.uptime_kuma.uptime_kuma_settings:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        keep_data_period_days: 90
        state: present
      register: idem_result

    - name: Verify no change on second run
      ansible.builtin.assert:
        that:
          - idem_result is not changed

    - name: Set only the Steam API key
      goodolclint.uptime_kuma.uptime_kuma_settings:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        steam_api_key: integration-test-steam-key
        state: present
      register: steam_result

    - name: Set the same Steam API key again
      goodolclint.uptime_kuma.uptime_kuma_settings:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        steam_api_key: integration-test-steam-key
        state: present
      register: steam_idem

    - name: Verify a Steam-key-only change is written once and never returned
      ansible.builtin.assert:
        that:
          - steam_result is changed
          - steam_idem is not changed
          - "'steamAPIKey' not in steam_idem.settings"

  always:
    - name: Restore the queried settings
      goodolclint.uptime_kuma.uptime_kuma_settings:
        api_url: "{{ uptime_kuma_api_url }}"
        api_token: "{{ uptime_kuma_api_token }}"
        keep_data_period_days: "{{ query_result.settings.keepDataPeriodDays | default(180) }}"
        steam_api_key: ""
        state: present
      failed_when: false
