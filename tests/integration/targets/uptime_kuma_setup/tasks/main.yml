---
- name: Predict first-time setup in check mode
  goodolclint.uptime_kuma.uptime_kuma_setup:
    api_url: "{{ uptime_kuma_api_url }}"
    username: "{{ uptime_kuma_api_username }}"
    password: "{{ uptime_kuma_api_password }}"
  check_mode: true
  register: check

- name: Run first-time setup (no-op if already done)
  goodolclint.uptime_kuma.uptime_kuma_setup:
    api_url: "{{ uptime_kuma_api_url }}"
    username: "{{ uptime_kuma_api_username }}"
    password: "{{ uptime_kuma_api_password }}"
  register: first

- name: Run setup again
  goodolclint.uptime_kuma.uptime_kuma_setup:
    api_url: "{{ uptime_kuma_api_url }}"
    username: "{{ uptime_kuma_api_username }}"
    password: "{{ uptime_kuma_api_password }}"
  register: second

- name: Verify setup is idempotent
  ansible.builtin.assert:
    that:
      - second is not changed
      - second.setup_performed is false
      - check.setup_performed is false
      - check.changed == first.changed
      - first.setup_performed == first.changed

- name: Verify login works with the created account
  goodolclint.uptime_kuma.uptime_kuma_tag:
    api_url: "{{ uptime_kuma_api_url }}"
    api_username: "{{ uptime_kuma_api_username }}"
    api_password: "{{ uptime_kuma_api_password }}"
    name: setup-probe
    color: "#000000"
    state: absent
