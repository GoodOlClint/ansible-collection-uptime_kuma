---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8 pylint ansible-core ansible-lint 'python-socketio[client]'

      - name: Run flake8
        run: flake8 plugins/ tests/

      - name: Run pylint
        run: pylint plugins/

      - name: Run ansible-lint
        run: ansible-lint --profile production

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install pytest pytest-cov ansible-core 'python-socketio[client]'

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=plugins/module_utils --cov-report=term-missing --cov-fail-under=80

  sanity:
    name: Sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible_collections/goodolclint/uptime_kuma

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Run ansible-test sanity
        working-directory: ansible_collections/goodolclint/uptime_kuma
        run: ansible-test sanity --python 3.12 --requirements --color -v

  integration:
    name: Integration (Uptime Kuma 2.x)
    runs-on: ubuntu-latest
    services:
      uptime-kuma:
        image: louislam/uptime-kuma:2
        env:
          UPTIME_KUMA_DB_TYPE: sqlite
        ports:
          - 3001:3001
        options: >-
          --health-cmd "curl -fsS -o /dev/null http://localhost:3001/"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible_collections/goodolclint/uptime_kuma

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible-core 'python-socketio[client]'

      - name: Run integration targets
        working-directory: ansible_collections/goodolclint/uptime_kuma/tests/integration
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
        run: |
          cp integration_config.yml.template integration_config.yml
          ansible-playbook run.yml

  build:
    name: Build Collection
    runs-on: ubuntu-latest
    needs: [lint, sanity, unit, integration]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Build collection
        run: ansible-galaxy collection build --force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: collection-tarball
          path: goodolclint-uptime_kuma-*.tar.gz
